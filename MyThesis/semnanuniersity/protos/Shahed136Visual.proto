#VRML_SIM R2025a utf8
# Visual-only, approximate-scale Shahed-136-inspired delta-wing UAV model.
# Publicly reported overall dimensions commonly cited: length ~3.5 m, wingspan ~2.5 m.
# Detailed airframe dimensions are not publicly verified here; mesh proportions are estimates.
# Axes: nose points along local +X; Y is up; wing span is along Z.
# This is a visual model for scene layout only, not a flight-dynamics or weapon simulation.

PROTO Shahed136Visual [
  field SFVec3f     translation 0 0 0
  field SFRotation  rotation    0 1 0 0
  field SFString    name        "Shahed-136 visual model"
  field SFColor     bodyColor   0.30 0.31 0.28
  field SFColor     markingColor 0.78 0.76 0.68
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    description "Visual-only approximate-scale delta-wing UAV. Nose points along local +X."
    children [
      # Main delta wing: planform spans approximately 2.50 m.
      Shape {
        appearance PBRAppearance {
          baseColor IS bodyColor
          roughness 0.82
          metalness 0.05
        }
        geometry IndexedFaceSet {
          coord Coordinate {
            point [
              1.58 0.00 0.00,
              -0.82 0.00 -1.25,
              -0.98 0.00 -1.02,
              -0.50 0.00 0.00,
              -0.98 0.00 1.02,
              -0.82 0.00 1.25,
              -0.28 0.045 0.00,
              -0.72 0.025 -0.72,
              -0.72 0.025 0.72
            ]
          }
          coordIndex [
            0, 1, 2, 6, -1,
            0, 6, 3, 4, 5, -1,
            6, 2, 7, -1,
            6, 7, 1, -1,
            6, 5, 8, -1,
            6, 8, 4, -1
          ]
          creaseAngle 0.4
          solid FALSE
        }
      }

      # Slightly raised central fuselage, approximate length ~3.5 m overall.
      Transform {
        translation -0.03 0.075 0
        rotation 0 0 1 0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS bodyColor
              roughness 0.78
            }
            geometry IndexedFaceSet {
              coord Coordinate {
                point [
                  1.72 0.00 0.00,
                  1.24 0.105 0.16,
                  0.78 0.15 0.20,
                  -0.72 0.15 0.20,
                  -1.30 0.075 0.13,
                  -1.42 0.00 0.00,
                  -1.30 0.075 -0.13,
                  -0.72 0.15 -0.20,
                  0.78 0.15 -0.20,
                  1.24 0.105 -0.16,
                  1.24 -0.07 0.13,
                  0.78 -0.10 0.17,
                  -0.72 -0.10 0.17,
                  -1.30 -0.05 0.11,
                  -1.42 0.00 0.00,
                  -1.30 -0.05 -0.11,
                  -0.72 -0.10 -0.17,
                  0.78 -0.10 -0.17,
                  1.24 -0.07 -0.13
                ]
              }
              coordIndex [
                0, 1, 2, 8, 9, -1,
                0, 9, 8, 7, 6, -1,
                1, 0, 9, 8, 2, -1,
                2, 3, 7, 8, -1,
                3, 4, 6, 7, -1,
                4, 5, 15, 6, -1,
                5, 14, 15, -1,
                14, 13, 15, -1,
                13, 12, 16, 15, -1,
                12, 11, 17, 16, -1,
                11, 10, 18, 17, -1,
                10, 0, 9, 18, -1,
                0, 10, 11, 2, -1,
                2, 11, 12, 3, -1,
                3, 12, 13, 4, -1,
                4, 13, 14, 5, -1,
                9, 18, 17, 8, -1,
                8, 17, 16, 7, -1,
                7, 16, 15, 6, -1
              ]
              solid FALSE
            }
          }
        ]
      }

      # Estimated aft-mounted pusher propeller hub and simplified blades.
      Transform {
        translation -1.24 0.13 0
        rotation 0 0 1 1.5708
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.12 0.12 0.11 }
            geometry Cylinder { height 0.16 radius 0.055 }
          }
        ]
      }
      Transform {
        translation -1.30 0.13 0
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.10 0.10 0.09 }
            geometry Box { size 0.035 0.035 0.62 }
          }
          Shape {
            appearance PBRAppearance { baseColor 0.10 0.10 0.09 }
            geometry Box { size 0.035 0.30 0.035 }
          }
        ]
      }

      # Approximate light-colored identification panels on both wing halves.
      Transform {
        translation 0.03 0.052 -0.62
        rotation 0 1 0 0.15
        children [
          Shape {
            appearance PBRAppearance { baseColor IS markingColor roughness 0.9 }
            geometry Box { size 0.34 0.008 0.12 }
          }
        ]
      }
      Transform {
        translation 0.03 0.052 0.62
        rotation 0 1 0 -0.15
        children [
          Shape {
            appearance PBRAppearance { baseColor IS markingColor roughness 0.9 }
            geometry Box { size 0.34 0.008 0.12 }
          }
        ]
      }

      # Small estimated underside sensor/cover detail, purely visual.
      Transform {
        translation 0.62 -0.035 0
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.18 0.18 0.17 }
            geometry Box { size 0.24 0.07 0.15 }
          }
        ]
      }
    ]
    boundingObject Box {
      size 3.45 0.42 2.50
    }
    physics Physics {
      density -1
      mass 18
    }
  }
}
